<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="TradeCafe — The calm way to trade with AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020809"/>
      <stop offset="0.55" stop-color="#03161A"/>
      <stop offset="1" stop-color="#021114"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#22D3B4" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#22D3B4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22D3B4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="0.86" r="0.5">
      <stop offset="0" stop-color="#7BE5CC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7BE5CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3B4"/>
      <stop offset="1" stop-color="#7BE5CC"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3B4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3B4" stop-opacity="1"/>
      <stop offset="1" stop-color="#7BE5CC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3B4" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22D3B4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#0E2A2E" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- wordmark -->
  <g transform="translate(72,78)">
    <g transform="translate(0,0)">
      <circle cx="22" cy="22" r="22" fill="#22D3B4" opacity="0.12"/>
      <circle cx="22" cy="22" r="13" fill="none" stroke="url(#teal)" stroke-width="2.2"/>
      <path d="M22 9 V22 L31 27" fill="none" stroke="#7BE5CC" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <text x="58" y="30" font-family="Geist, Manrope, ui-sans-serif, system-ui" font-size="26" font-weight="700" fill="#F4FBFA" letter-spacing="0.5">TradeCafe</text>
    <text x="58" y="50" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#7BE5CC" letter-spacing="3">CALM · INTELLIGENT · 24/7</text>
  </g>

  <!-- top right meta pill -->
  <g transform="translate(990,82)">
    <rect x="0" y="0" rx="22" ry="22" width="138" height="44" fill="#06191D" stroke="#1A3B40" stroke-width="1"/>
    <circle cx="22" cy="22" r="5" fill="#22D3B4"/>
    <circle cx="22" cy="22" r="5" fill="#22D3B4" opacity="0.35" filter="url(#soft)"/>
    <text x="36" y="27" font-family="JetBrains Mono, monospace" font-size="11" fill="#9FE9D8" letter-spacing="2">LIVE · ARBITRUM</text>
  </g>

  <!-- headline -->
  <g transform="translate(72,210)">
    <text font-family="Geist, Manrope, ui-sans-serif, system-ui" font-size="78" font-weight="700" fill="#F4FBFA" letter-spacing="-1.5">
      <tspan x="0" y="0">The calm way</tspan>
      <tspan x="0" y="92">to trade with </tspan>
      <tspan font-style="italic" fill="url(#teal)">AI.</tspan>
    </text>
    <text x="0" y="220" font-family="Manrope, ui-sans-serif, system-ui" font-size="22" font-weight="400" fill="#A8C5C5" letter-spacing="0.1">
      <tspan x="0" dy="0">A 24/7 AI trading ecosystem — terminal, signals,</tspan>
      <tspan x="0" dy="32">automation, pooled strategies, partner network.</tspan>
    </text>
  </g>

  <!-- chart panel (right) -->
  <g transform="translate(740,210)">
    <rect x="0" y="0" rx="18" ry="18" width="388" height="244" fill="#04141700" stroke="#16363B" stroke-width="1"/>
    <rect x="0" y="0" rx="18" ry="18" width="388" height="244" fill="#02191D" opacity="0.55"/>

    <!-- panel header -->
    <g transform="translate(20,22)">
      <text font-family="Geist, ui-sans-serif" font-size="13" font-weight="600" fill="#F4FBFA">BTC · PERP</text>
      <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600" fill="#F4FBFA">68,420<tspan fill="#7BE5CC" font-size="13" dx="6">+1.84%</tspan></text>
      <g transform="translate(260,-2)">
        <rect x="0" y="0" rx="10" ry="10" width="100" height="22" fill="#0D2A2D" stroke="#1F4448" stroke-width="1"/>
        <text x="12" y="15" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#7BE5CC">AI SIGNAL · LONG</text>
      </g>
    </g>

    <!-- chart area -->
    <g transform="translate(20,90)">
      <!-- grid -->
      <g stroke="#0E2A2E" stroke-width="1">
        <line x1="0" y1="0" x2="348" y2="0"/>
        <line x1="0" y1="34" x2="348" y2="34"/>
        <line x1="0" y1="68" x2="348" y2="68"/>
        <line x1="0" y1="102" x2="348" y2="102"/>
        <line x1="0" y1="136" x2="348" y2="136"/>
      </g>
      <!-- area fill under line -->
      <path d="M0 110 L24 96 L48 104 L72 84 L96 92 L120 70 L144 78 L168 58 L192 64 L216 44 L240 50 L264 32 L288 38 L312 20 L336 28 L348 18 L348 136 L0 136 Z" fill="url(#area)"/>
      <!-- price line -->
      <path d="M0 110 L24 96 L48 104 L72 84 L96 92 L120 70 L144 78 L168 58 L192 64 L216 44 L240 50 L264 32 L288 38 L312 20 L336 28 L348 18" fill="none" stroke="url(#line)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- last marker -->
      <circle cx="348" cy="18" r="4" fill="#7BE5CC"/>
      <circle cx="348" cy="18" r="9" fill="#22D3B4" opacity="0.35"/>
    </g>
  </g>

  <!-- bottom strip: feature chips -->
  <g transform="translate(72,540)" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2.5" fill="#9FE9D8">
    <g>
      <rect x="0" y="0" rx="16" ry="16" width="178" height="36" fill="#06191D" stroke="#1A3B40"/>
      <text x="20" y="22">AI TERMINAL</text>
    </g>
    <g transform="translate(196,0)">
      <rect x="0" y="0" rx="16" ry="16" width="172" height="36" fill="#06191D" stroke="#1A3B40"/>
      <text x="20" y="22">LIVE SIGNALS</text>
    </g>
    <g transform="translate(384,0)">
      <rect x="0" y="0" rx="16" ry="16" width="186" height="36" fill="#06191D" stroke="#1A3B40"/>
      <text x="20" y="22">POOLED ALPHA</text>
    </g>
    <g transform="translate(586,0)">
      <rect x="0" y="0" rx="16" ry="16" width="222" height="36" fill="#06191D" stroke="#1A3B40"/>
      <text x="20" y="22">PARTNER NETWORK</text>
    </g>
  </g>

  <!-- url -->
  <text x="1128" y="568" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="3" fill="#7BE5CC">TRADECAFE.AI</text>

  <!-- subtle border -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#0E2A2E"/>
</svg>
